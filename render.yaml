# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy the API as a Render web service (free or paid tier).
#
# Required env vars you must set in the Render dashboard (or via envVar groups):
#   DATABASE_URL       — Neon/Supabase Postgres connection string
#   BETTER_AUTH_SECRET — random 32+ char secret
#   BETTER_AUTH_URL    — https://<your-api>.onrender.com
#   WEB_ORIGIN         — https://<your-web>.pages.dev (or custom domain)
#   ENCRYPTION_KEY     — 64 hex chars (32 bytes), e.g. `openssl rand -hex 32`
#
# Optional: MICROSOFT_CLIENT_ID / MICROSOFT_CLIENT_SECRET / MICROSOFT_TENANT_ID
# for Microsoft OAuth sign-in.

services:
  - type: web
    name: qatar-edu-api
    runtime: node
    plan: free
    # pnpm monorepo: install deps at the workspace root, run the API via tsx.
    # (tsx is a devDependency — use `pnpm install` without --prod, or switch
    # to a paid plan / Docker deploy with a production install.)
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter @qatar-edu/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false # must be 64 hex chars: `openssl rand -hex 32`
