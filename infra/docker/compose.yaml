name: hallili

services:
  postgres:
    image: postgres:17-alpine
    container_name: hallili-postgres
    environment:
      POSTGRES_USER: hallili
      POSTGRES_PASSWORD: hallili
      POSTGRES_DB: hallili
    ports:
      - '5432:5432'
    volumes:
      - hallili-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hallili -d hallili']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  hallili-postgres-data:
